<!doctype html>
<html>
<head><meta charset="utf-8"><title>EJS mame-current mxsqy 本地复现</title></head>
<body>
<div id="game" style="width:800px;height:600px"></div>
<script>
  // 自动化验证用：缓存全部控制台输出，供 agent-browser eval 读取
  window.__logs = []
  ;['log', 'info', 'warn', 'error'].forEach(function (k) {
    var orig = console[k].bind(console)
    console[k] = function () {
      try { window.__logs.push(k + ': ' + Array.prototype.map.call(arguments, String).join(' ')) } catch (e) {}
      orig.apply(null, arguments)
    }
  })
</script>
<script>
  // 体检用：复刻适配器里「把 retroarch.cfg 的 audio_latency 提到 128」那一步，验证两件事：
  //   1) 开局前（startGame 被调用的那一刻）cfg 里到底有没有 audio_latency
  //   2) 改了以后核心日志里的 Buffer size 是不是从 24576 变成 49152
  var CFG = '/home/web_user/.config/retroarch/retroarch.cfg'
  Object.defineProperty(window, 'EJS_emulator', {
    configurable: true,
    set: function (emu) {
      // 探测用：这个 defineProperty 只有 setter，读 window.EJS_emulator 拿到的是 undefined
      window.__emu = emu
      var orig = emu.startGame
      emu.startGame = function () {
        try {
          var fs = emu.gameManager.FS
          var txt = new TextDecoder().decode(fs.readFile(CFG))
          window.__cfgBefore = txt
          var after = txt.indexOf('audio_latency = 64') >= 0
            ? txt.split('audio_latency = 64').join('audio_latency = 128')
            : txt + (txt.endsWith('\n') ? '' : '\n') + 'audio_latency = 128\n'
          fs.writeFile(CFG, after)
          window.__cfgAfter = new TextDecoder().decode(fs.readFile(CFG))
        } catch (e) {
          window.__cfgErr = String(e)
        }
        return orig.apply(emu, arguments)
      }
    },
  })
</script>
<script>
  // 完全复刻线上路径：fetch 本地 zip → blob URL → gameName=mxsqy102tw.zip → mame-current
  fetch('/__mxsqy.zip')
    .then(function (r) {
      if (!r.ok) throw new Error('zip 加载失败 ' + r.status)
      return r.blob()
    })
    .then(function (blob) {
      window.EJS_player = '#game'
      window.EJS_core = 'mame-current'
      window.EJS_gameUrl = URL.createObjectURL(blob)
      // mame-current 要求内容带父目录（父目录即 rompath）：根路径解析不出 parent path
      window.EJS_gameName = 'roms/mxsqy102tw.zip'
      window.EJS_pathtodata = '/emulatorjs/'
      window.EJS_startOnLoaded = true
      window.EJS_FORCE_DEBUG_LOG = true
      var s = document.createElement('script')
      s.src = '/emulatorjs/loader.js'
      document.body.appendChild(s)
    })
    .catch(function (e) {
      document.body.innerHTML = '<pre>测试页初始化失败: ' + e.message + '</pre>'
    })
</script>
</body>
</html>
