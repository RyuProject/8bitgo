<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 生产路由会把尾斜杠去掉；base 保证脚本、WASM 和字体始终从 /web/cs16/ 解析。 -->
    <base href="/web/cs16/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Counter-Strike 1.6 · 网页版</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0a0a0c; color: #e6e6e6; font: 14px/1.5 system-ui, sans-serif; }
      #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
      #stage { position: relative; flex: 1; min-height: 0; background: #000; }
      #canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
      #overlay {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(circle at 50% 30%, #16202b, #05070a);
        text-align: center; padding: 24px;
      }
      #overlay.hidden { display: none; }
      #title { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
      #sub { opacity: .7; max-width: 560px; }
      #bar { width: min(460px, 80vw); height: 8px; border-radius: 6px; background: #1d2733; overflow: hidden; }
      #bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width .2s; }
      #phase { font-variant-numeric: tabular-nums; opacity: .85; }
      #net { opacity: .6; font-size: 12px; }
      #log { width: min(640px, 92vw); max-height: 32vh; overflow: auto; font: 12px/1.45 ui-monospace, monospace;
             background: #0c1116; border: 1px solid #1d2733; border-radius: 8px; padding: 10px; text-align: left; }
      #log .err { color: #ff6b6b; }
      #errbox { color: #ff8a80; max-width: 620px; white-space: pre-wrap; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
      select, button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #2a3744; background: #141c24; color: #e6e6e6; }
      button { cursor: pointer; }
      button:hover { background: #1c2731; }
      #hud { position: absolute; top: 8px; left: 8px; font: 12px ui-monospace, monospace; opacity: .55; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="hud"></div>
        <div id="overlay">
          <div id="title">Counter-Strike 1.6 · 网页版</div>
          <div id="sub">Xash3D-FWGS (WebAssembly) 引擎运行 CS1.6，内置 12 张经典地图。资源使用 Zstd 分片压缩，会边下载、边校验、边写入游戏盘。进图后按 ~ 打开控制台。</div>
          <div class="row">
            <label>地图
              <select id="map">
                <option value="de_dust2">de_dust2</option>
                <option value="de_dust">de_dust</option>
                <option value="de_inferno">de_inferno</option>
                <option value="de_nuke">de_nuke</option>
                <option value="de_aztec">de_aztec</option>
                <option value="de_train">de_train</option>
                <option value="de_cbble">de_cbble</option>
                <option value="cs_office">cs_office</option>
                <option value="cs_italy">cs_italy</option>
                <option value="cs_assault">cs_assault</option>
                <option value="cs_militia">cs_militia</option>
                <option value="de_vertigo">de_vertigo</option>
              </select>
            </label>
            <button id="start">开始</button>
          </div>
          <div id="bar"><i></i></div>
          <div id="phase">待开始</div>
          <div id="net"></div>
          <pre id="errbox"></pre>
          <div id="log"></div>
        </div>
      </div>
    </div>
    <!--
      加载 esbuild 产物，不是 cs16.js 本体：引擎 dist 是 `export * from './net'` 这种
      「目录 + 无扩展名」的裸模块写法，原生 ESM 解析不了（dev 会兜底成根 index.html）。
      官方 raw.js 那条路在本引擎版本（1.2.2）上会卡在版本检查，详见 cs16.js 头注释。
    -->
    <script type="module" src="./cs16.bundle.js?v=20260923-zstd2"></script>
  </body>
</html>
