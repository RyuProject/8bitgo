<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="UNDERTALE 授权分发启动器。Butterscotch 实验性开源运行端，授权资源只从 8bitgo.com 主域或 HTTPS 子域读取并保存在浏览器本机。非 Toby Fox、GameMaker 或其关联方的官方产品。"
    />
    <title>UNDERTALE · 实验性运行端 · 8BitGo</title>
    <link rel="stylesheet" href="/web/undertale/styles.css" />
    <script type="module" src="/web/undertale/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="launcher" id="launcher" aria-label="UNDERTALE 正在加载">
        <div class="progress-wrap" id="progress-wrap">
          <progress id="progress" max="100" value="0" aria-label="游戏加载进度">0%</progress>
          <span class="sr-only" id="progress-label">正在加载游戏</span>
          <span class="sr-only" id="progress-value">0%</span>
        </div>
        <p class="message" id="message" role="status" aria-live="polite" hidden></p>

        <div class="runtime-state" aria-hidden="true" hidden>
          <span class="state-dot" id="state-dot"></span>
          <span id="runtime-state">正在准备…</span>
        </div>

        <div id="support-list" hidden aria-hidden="true">
          <div data-check="jspi"><b></b></div>
          <div data-check="opfs"><b></b></div>
          <div data-check="webgl"><b></b></div>
        </div>

        <section id="import-card" hidden aria-hidden="true">
          <button id="start-authorized" type="button"></button>
          <button id="start-cached" type="button"></button>
          <button id="select-folder" type="button"></button>
          <button id="cancel-import" type="button"></button>
          <button id="clear-library" type="button"></button>
          <input id="folder-input" type="file" webkitdirectory directory multiple />
        </section>
      </section>

      <section class="game-view" id="game-view" hidden aria-label="UNDERTALE 游戏画面">
        <div class="canvas-stage" id="canvas-stage">
          <canvas id="canvas" tabindex="0" aria-label="游戏画布"></canvas>
        </div>

        <div class="touch-controls" id="touch-controls" aria-label="触屏控制器">
          <div class="dpad" aria-label="方向键">
            <button data-key="38" aria-label="上">▲</button>
            <button data-key="37" aria-label="左">◀</button>
            <button data-key="40" aria-label="下">▼</button>
            <button data-key="39" aria-label="右">▶</button>
          </div>
          <div class="action-pad" aria-label="动作键">
            <button class="key-c" data-key="67" aria-label="菜单 C">C</button>
            <button class="key-x" data-key="88" aria-label="取消 X">X</button>
            <button class="key-z" data-key="90" aria-label="确认 Z">Z</button>
          </div>
        </div>
      </section>
    </main>
    <noscript>请启用 JavaScript。</noscript>
  </body>
</html>
