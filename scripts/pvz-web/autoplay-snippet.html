<!-- PvZ_AUTOPLAY_START -->
<script>
"use strict";
(function () {
  // 来源校验：若 <head> 里的来源校验脚本判定当前页面不在允许来源，会置 window.__PVZ_BLOCKED__。
  // 这里直接退出，既不下载数据也不启动游戏——满足「仅允许 https://*.8bitgo.com 入口访问」的要求。
  if (window.__PVZ_BLOCKED__) return;

  var LOCALE = window.PVZ_LOCALE || '';
  if (LOCALE) console.log('[PvZ] 当前语言：' + LOCALE);

  // ===== 配置（可在引用本段前用 window.PVZ_DATA_BASE / PVZ_MANIFEST_URL / PVZ_DATA_VERSION 覆盖）=====
  // DATA_BASE：资源基址。页面与数据在同源（都是 https://html5.8bitgo.com/PvZ/...）时 fetch 同源，
  //   浏览器不发 Origin、也不校验 CORS——这种情况根本不需要配任何 CORS 头。
  // MANIFEST_URL：资源清单（JSON），相对页面目录。每项：
  //   { "r2": "存储端相对路径", "fs": "写入 WASM 虚拟文件系统的目标路径", "size": 字节数(可选) }
  //   也支持纯字符串（此时 r2 === fs）。
  //   引擎只认 FS 根下的 /main.pak 和 /properties/*（见原生 startGame 里的
  //   Module.FS.writeFile("/"+o, …)），所以 fs 必须写成 "main.pak" 和 "properties/..."，
  //   即使存储端 main.pak 被放在了别处，也用 r2 指实际位置、fs 指 "main.pak"。
  var DATA_BASE = window.PVZ_DATA_BASE != null ? window.PVZ_DATA_BASE : './';
  var MANIFEST_URL = window.PVZ_MANIFEST_URL != null ? window.PVZ_MANIFEST_URL : './pvz-manifest.json';
  var DATA_VERSION = window.PVZ_DATA_VERSION || '3';

  var qs = new URLSearchParams(location.search);
  var FORCE = qs.has('nocache');
  // 并发数：HTTP/1.1 每域名 6 条连接，HTTP/2 可多路复用；8 是两者的折中。
  // 原实现**串行**逐个 fetch —— 2000 多个文件时纯等待就要几十秒，这里改成并发池。
  var CONCURRENCY = Math.max(1, Math.min(24, parseInt(qs.get('conc'), 10) || 8));
  // wasm（约 7MB）加载失败时 moduleReadyPromise 可能永远不 resolve，页面会一直卡在
  // 「Preparing WebAssembly runtime…」且毫无提示 —— 给一个超时兜底。
  var WASM_TIMEOUT_MS = 120000;
  // 可选资源 404 后多久才重试。reanim/ 漏传时是 2000 多个 404，不记一笔的话
  // 每次进页面都要把这几千个请求重放一遍，白白浪费几十秒和大量流量。
  var MISSING_TTL_MS = 6 * 3600 * 1000;

  var IDB_NAME = 'pvz-portable';
  var IDB_STORE = 'resources';
  /*
    缓存粒度从「整组一个大对象」改成「每条资源一个 key」。
    为什么：整组缓存时清单里增删一个文件（签名变了）就要把 main.pak（44MB）在内的
    全部资源重新下载一遍；按 fs 分条后只补下缺的那几个。
    「资源内容变了但路径没变」无法用 key 感知 —— 那种情况 bump PVZ_DATA_VERSION 整组失效。
  */
  var KEY_PREFIX = 'file:' + (LOCALE || 'default') + ':' + DATA_VERSION + ':';
  var OLD_PREFIX = 'pvz-data-files:'; // 旧版整组缓存的 key 前缀，命中后顺手清掉

  // 引擎缺了它一定起不来；其余（reanim/、properties/）属于可选，缺了只告警。
  // 这一条是 2026-09-23 的事故修复：reanim/ 这 2000 多个文件漏传时，旧实现在第一个
  // 404 处就 throw，整批下载前功尽弃（连已下好的 44MB main.pak 也被 restoreUpload 清掉），
  // 玩家看到的是「自动加载失败」而不是「缺了动画资源」。
  function isRequired(fs) { return fs === 'main.pak'; }

  var autoStarted = false;

  // 退出重载守护：避免引擎异常退出（缺资源/FATAL）造成无限刷新死循环。
  // 60 秒内自动刷新超过 3 次即判定为异常，停止自动刷新，改为提示手动处理。
  window.__pvzGuardedReload = function () {
    try {
      var KEY = 'pvz-reloads', now = Date.now();
      var arr = JSON.parse(sessionStorage.getItem(KEY) || '[]');
      arr = arr.filter(function (t) { return now - t < 60000; });
      if (arr.length >= 3) { console.error('[PvZ] 自动刷新次数过多，已停止，避免死循环'); return false; }
      arr.push(now); sessionStorage.setItem(KEY, JSON.stringify(arr));
    } catch (e) {}
    window.location.reload();
    return true;
  };

  // 进度文本每 150ms 才写一次 DOM：并发下载时下载回调每秒能触发上百次，
  // 每次都改 textContent 会把主线程时间全花在重排上，反而拖慢下载。
  var lastPaintAt = 0;
  function paint(msg, isError) {
    lastPaintAt = Date.now();
    loadStatus.style.display = 'block';
    loadStatus.textContent = msg;
    loadStatus.classList.toggle('has-error', !!isError);
  }
  function setStatus(msg, isError) {
    if (Date.now() - lastPaintAt >= 150) paint(msg, isError);
  }
  function setStatusNow(msg, isError) { paint(msg, !!isError); }

  /*
    加载进度只用一条进度条表达：不再逐文件/逐字节写文案。
    2000+ 个资源时那串文字既刷屏、也把主线程时间花在 textContent 重排上。
    出错仍然走上面的 paint()（错误需要文字说明）。
  */
  var loadBar = document.getElementById('load-bar');
  var loadBarFill = loadBar ? loadBar.firstElementChild : null;
  function setProgress(ratio) {
    if (!loadBarFill) return;
    var p = !ratio || ratio < 0 ? 0 : (ratio > 1 ? 1 : ratio);
    loadBarFill.style.width = (p * 100).toFixed(2) + '%';
  }
  // 页面后段的 startGame()（把资源写进 WASM FS 那一段）复用同一个进度条
  window.__pvzSetProgress = setProgress;

  function enterLoading(msg) {
    dropZone.classList.remove('ready');
    dropZone.classList.add('loading');
    dropZone.style.pointerEvents = 'none';
    loadStatus.style.display = 'none';
    setProgress(0);
  }
  function restoreUpload(msg) {
    dropZone.classList.remove('loading');
    dropZone.style.pointerEvents = '';
    loadStatus.style.display = 'block';
    loadStatus.textContent = msg || '';
    loadStatus.classList.add('has-error');
    collectedFiles.clear();
    refreshUI();
  }

  // ===== IndexedDB：连接只开一次复用。旧实现每次 get/put 都 indexedDB.open，
  // ===== 几千条资源时开关连接本身就是一笔可观的开销。
  var dbPromise = null;
  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { /* 另一个标签页占着旧版本，忽略即可 */ };
    });
    return dbPromise;
  }
  // 统一的事务包装：fn 可返回一个 { __promise } 表示「结果异步产生」，等事务完成后再兑现
  function tx(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(IDB_STORE, mode);
        var deferred = null;
        try {
          var out = fn(t.objectStore(IDB_STORE), t);
          if (out && out.__promise) deferred = out.__promise;
        } catch (e) { try { t.abort(); } catch (e2) {} reject(e); return; }
        t.oncomplete = function () { resolve(deferred || undefined); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error || new Error('IDB 事务被中止')); };
      });
    });
  }
  function deferred() {
    return { __promise: null, bind: function (p) { this.__promise = p; return this; } };
  }
  // 批量写入：一个事务里 put 多条，比每条一个事务快一个数量级
  function idbPutMany(pairs) {
    if (!pairs.length) return Promise.resolve();
    return tx('readwrite', function (store) {
      for (var i = 0; i < pairs.length; i++) store.put(pairs[i][1], pairs[i][0]);
    });
  }
  // 列出某前缀下的所有 key（用于清理失效缓存）。IDB 没有前缀查询，用 key range 模拟。
  function idbKeysWithPrefix(prefix) {
    return tx('readonly', function (store) {
      var d = deferred();
      var keys = [];
      var req = store.openKeyCursor(IDBKeyRange.bound(prefix, prefix + '￿'));
      d.bind(new Promise(function (resolve, reject) {
        req.onsuccess = function () {
          var c = req.result;
          if (!c) return resolve(keys);
          keys.push(String(c.key));
          c.continue();
        };
        req.onerror = function () { reject(req.error); };
      }));
      return d;
    });
  }
  function idbDelete(keys) {
    if (!keys.length) return Promise.resolve();
    return tx('readwrite', function (store) {
      for (var i = 0; i < keys.length; i++) store.delete(keys[i]);
    });
  }
  /*
    逐条流式读取指定 fs 集合。
    为什么不用 getAll：整组资源 70MB+，getAll 会一次性全读进 JS 堆；
    用 cursor 可以「读一条 → 转成 File → 释放」，峰值只是一条的大小。
    onEach 返回 false 表示该条不要（例如已过期/已拿过）。
  */
  function idbEach(prefix, wantFs, onEach) {
    var want = wantFs || null;
    return tx('readonly', function (store) {
      var d = deferred();
      var req = store.openCursor(IDBKeyRange.bound(prefix, prefix + '￿'));
      d.bind(new Promise(function (resolve, reject) {
        req.onsuccess = function () {
          var c = req.result;
          if (!c) return resolve();
          var fs = String(c.key).slice(prefix.length);
          if (!want || want[fs]) onEach(fs, c.value);
          c.continue();
        };
        req.onerror = function () { reject(req.error); };
      }));
      return d;
    });
  }

  function normEntry(e) {
    if (typeof e === 'string') return { r2: e, fs: e, size: 0 };
    return { r2: e.r2, fs: e.fs, size: Number(e.size) || 0 };
  }

  function loadManifest() {
    var mUrl = MANIFEST_URL;
    if (FORCE) mUrl += (mUrl.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    return fetch(mUrl, { credentials: 'same-origin', cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('清单 HTTP ' + r.status);
      return r.json();
    }).then(function (list) {
      if (!Array.isArray(list) || !list.length) throw new Error('清单为空或格式不对');
      return list.map(normEntry);
    });
  }

  function fmtMB(bytes) { return (bytes / 1048576).toFixed(1) + ' MB'; }

  /*
    下载：并发池 + 大文件流式读 + 失败重试 + 404 记一笔避免重放。
    - 必需的（main.pak）优先入队，它 44MB 最耗时，先起步能和其它文件重叠；
      其余按体积降序，避免结尾卡在一堆大文件上。
    - 可选文件失败只记数跳过；必需文件失败直接中止并报错。
  */
  function downloadAll(manifest, onProgress) {
    var order = manifest.slice().sort(function (a, b) {
      var ra = isRequired(a.fs) ? 1 : 0, rb = isRequired(b.fs) ? 1 : 0;
      if (ra !== rb) return rb - ra;
      return b.size - a.size;
    });

    var total = order.length;
    var doneCount = 0, doneBytes = 0, skipped = [];
    var pendingPairs = [], pendingBytes = 0, flushChain = Promise.resolve();
    var idx = 0, failed = null;

    function flush() {
      if (!pendingPairs.length) return;
      var batch = pendingPairs;
      pendingPairs = []; pendingBytes = 0;
      // 串行化写入事务：并行的写事务会互相阻塞，排队反而更快也更稳
      flushChain = flushChain.then(function () {
        return idbPutMany(batch).catch(function (e) { console.warn('[PvZ] 写缓存失败：', e); });
      });
    }
    function cache(fs, value) {
      pendingPairs.push([KEY_PREFIX + fs, value]);
      pendingBytes += value.size || 0;
      if (pendingPairs.length >= 64 || pendingBytes >= 8 * 1048576) flush();
    }

    function fetchBytes(entry) {
      var url = DATA_BASE + entry.r2;
      var attempt = 0;
      function run() {
        return fetch(url, { credentials: 'same-origin' }).then(function (r) {
          if (!r.ok) {
            var err = new Error(entry.r2 + ' HTTP ' + r.status);
            err.httpStatus = r.status;
            throw err;
          }
          var len = Number(r.headers.get('content-length')) || entry.size || 0;
          if (!r.body || !len || len < 1048576) {
            // 小文件直接读：流式反而多一次 chunk 拼接
            return r.arrayBuffer().then(function (b) {
              onProgress(b.byteLength, ++doneCount, total);
              return new Uint8Array(b);
            });
          }
          /*
            大文件边下边报进度：44MB 的 main.pak 否则会让进度条几十秒不动。
            按 Content-Length 预分配一块 buffer 直接往里写 —— 若先攒 chunks 数组最后再拼接，
            峰值内存是两份 44MB；预分配后只有一份（长度不准时才扩容一次）。
          */
          var reader = r.body.getReader();
          var cap = len, buf = new Uint8Array(cap), off = 0;
          function pump() {
            return reader.read().then(function (res) {
              if (res.done) {
                onProgress(0, ++doneCount, total);
                return off === cap ? buf : buf.slice(0, off);
              }
              var chunk = res.value;
              if (off + chunk.length > cap) {
                cap = Math.max(cap * 2, off + chunk.length);
                var nb = new Uint8Array(cap);
                nb.set(buf.subarray(0, off));
                buf = nb;
              }
              buf.set(chunk, off); off += chunk.length;
              onProgress(chunk.length, doneCount, total);
              return pump();
            });
          }
          return pump();
        }).catch(function (e) {
          // 4xx 不重试（重试也是同样的结果，白等）；网络类错误重试 2 次
          if (attempt < 2 && !(e && e.httpStatus >= 400 && e.httpStatus < 500)) {
            attempt++;
            return new Promise(function (res) { setTimeout(res, attempt * 400); }).then(run);
          }
          throw e;
        });
      }
      return run();
    }

    function worker() {
      function next() {
        if (failed || idx >= total) return Promise.resolve();
        var entry = order[idx++];
        return fetchBytes(entry).then(function (bytes) {
          cache(entry.fs, { bytes: bytes, size: bytes.byteLength });
          doneBytes += bytes.byteLength;
          return next();
        }, function (e) {
          if (isRequired(entry.fs)) { failed = e; return; }
          // 可选资源缺失（例如 reanim/ 漏传）不该拖垮整批下载。
          // 记一笔「这个文件取不到」，短期内不再重放这几千个必然 404 的请求。
          cache(entry.fs, { failed: (e && e.httpStatus) || 0, at: Date.now() });
          skipped.push(entry.fs);
          return next();
        });
      }
      return next();
    }

    var pool = [];
    for (var i = 0; i < Math.min(CONCURRENCY, total); i++) pool.push(worker());
    return Promise.all(pool).then(function () {
      flush();
      return flushChain;
    }).then(function () {
      if (failed) throw failed;
      return { skipped: skipped, bytes: doneBytes };
    });
  }

  function withTimeout(p, ms, msg) {
    return Promise.race([
      p,
      new Promise(function (_, reject) { setTimeout(function () { reject(new Error(msg)); }, ms); }),
    ]);
  }

  /*
    取全部资源：命中缓存的直接复用，只下载缺的那部分。
    have 里是 fs -> Uint8Array，调用方负责转成 File 并释放。
  */
  function getFiles(manifest, onProgress) {
    var fsSet = {}, totalSize = 0, i;
    for (i = 0; i < manifest.length; i++) { fsSet[manifest[i].fs] = true; totalSize += manifest[i].size; }
    // 缓存里记着「取不到」的那些，最后要和本次下载失败的合并起来一起提示
    var carrySkipped = [];

    var have = Object.create(null), haveCount = 0;
    // 「上次就没取到」且还在 TTL 内的条目：直接算作缺失，不再重放请求
    var stillMissing = Object.create(null);

    function readCache(wantFs) {
      if (FORCE) return Promise.resolve();
      return idbEach(KEY_PREFIX, wantFs, function (fs, val) {
        if (val && val.bytes) { have[fs] = val.bytes; haveCount++; }
        else if (val && val.failed && Date.now() - (val.at || 0) < MISSING_TTL_MS) stillMissing[fs] = true;
      }).catch(function (e) { console.warn('[PvZ] 读缓存失败，改为全部下载：', e); });
    }

    // 第一轮：读缓存，挑出缺的
    return readCache(fsSet).then(function () {
      var missing = [], missingBytes = 0, skippedCache = [], j;
      for (j = 0; j < manifest.length; j++) {
        var fsv = manifest[j].fs;
        if (have[fsv]) continue;
        if (stillMissing[fsv]) { skippedCache.push(fsv); continue; }
        missing.push(manifest[j]); missingBytes += manifest[j].size;
      }
      carrySkipped = skippedCache;
      if (!missing.length) {
        setProgress(1);
        return { skipped: carrySkipped, bytes: 0 };
      }
      // 分母用「本次真正要下的字节数」：命中缓存的那些不算在内，
      // 否则进度条会停在中间不动（看着像卡住）。
      var progressTotal = missingBytes || totalSize || 1;
      var progressSeen = 0;
      setProgress(0);
      return downloadAll(missing, function (n, done, total) {
        progressSeen += n;
        setProgress(progressSeen / progressTotal);
        if (onProgress) onProgress(n, done, total);
      }).then(function (res) {
        // 第二轮：只回读「这次新下载」的那批，避免把已缓存的 70MB 再反序列化一遍
        var want = {};
        for (var k = 0; k < missing.length; k++) want[missing[k].fs] = true;
        return readCache(want).then(function () { return res; });
      });
    }).then(function (res) {
      // 清理：清单里已经没有的旧条目，以及旧版「整组一个大对象」的缓存
      var want = {};
      for (var n = 0; n < manifest.length; n++) want[KEY_PREFIX + manifest[n].fs] = true;
      return idbKeysWithPrefix(KEY_PREFIX).then(function (keys) {
        return idbDelete(keys.filter(function (k) { return !want[k]; }));
      }).catch(function () {}).then(function () {
        return idbKeysWithPrefix(OLD_PREFIX).then(function (keys) {
          if (!keys.length) return;
          console.log('[PvZ] 清理旧版整组缓存 ' + keys.length + ' 条');
          return idbDelete(keys);
        }).catch(function () {});
      }).then(function () { return res; });
    }).then(function (res) {
      res.skipped = (res.skipped || []).concat(carrySkipped);
      res.files = have;
      return res;
    });
  }

  var accBytes = 0;
  // 进度条按字节推进（比例在 getFiles 里换算），这里只累计字节数，不再输出文字
  function onProgress(n, done, total) {
    accBytes += n;
  }

  function autoLoad() {
    if (autoStarted) return;
    autoStarted = true;
    if (typeof gameStarted !== 'undefined' && gameStarted) { autoStarted = false; return; }
    enterLoading('正在从服务器加载资源…');

    // wasm 与资源并行加载；超时只作兜底，避免 wasm 静默失败时页面永远卡住
    var wasmReady = window.moduleReadyPromise
      ? withTimeout(window.moduleReadyPromise, WASM_TIMEOUT_MS, 'WebAssembly 运行时加载超时（' + (WASM_TIMEOUT_MS / 1000) + 's）')
      : Promise.resolve();

    loadManifest()
      .then(function (manifest) {
        return getFiles(manifest, onProgress).then(function (res) { return { manifest: manifest, res: res }; });
      })
      .then(function (o) {
        var files = o.res.files, res = o.res;
        collectedFiles.clear();
        var gotMain = false, count = 0, fs;
        for (fs in files) {
          if (!Object.prototype.hasOwnProperty.call(files, fs)) continue;
          var bytes = files[fs];
          if (!bytes) continue;
          // 转成 File 后立刻释放 Uint8Array：否则同一份数据在 JS 堆里存两份（峰值翻倍）
          collectedFiles.set(fs, new File([bytes], fs.split('/').pop()));
          files[fs] = null;
          if (fs === 'main.pak') gotMain = true;
          count++;
        }
        if (!gotMain) {
          restoreUpload('资源缺少 main.pak，请检查 pvz-manifest.json 的 r2 路径后重试，或手动选择资源。');
          autoStarted = false;
          return;
        }
        if (res.skipped && res.skipped.length) {
          var dirs = {};
          for (var i = 0; i < res.skipped.length; i++) {
            var d = res.skipped[i].indexOf('/') > 0 ? res.skipped[i].split('/')[0] : res.skipped[i];
            dirs[d] = (dirs[d] || 0) + 1;
          }
          var desc = Object.keys(dirs).map(function (k) { return k + ' × ' + dirs[k]; }).join('、');
          var warn = '缺少 ' + res.skipped.length + ' 个可选资源（' + desc + '），游戏可能无法正常启动';
          console.warn('[PvZ] ' + warn + '；请用 npm run pvz:check-assets 自检资源是否上传完整');
          // 缺的不是 main.pak，仍然尝试启动，但把缺失情况如实告诉玩家
          setStatusNow('已加载 ' + count + ' 个文件；' + warn, false);
        }
        refreshUI();
        window.__pvzStartTs = Date.now();
        return wasmReady.then(function () { startGame(); }, function (e) {
          restoreUpload('引擎加载失败（' + (e && e.message ? e.message : e) + '），请检查网络后刷新重试。');
          autoStarted = false;
        });
      })
      .catch(function (e) {
        if (!autoStarted) return; // 上面已经给过提示
        console.error('[PvZ] 自动加载失败：', e);
        restoreUpload('自动加载失败（' + (e && e.message ? e.message : e) + '），可手动选择资源或刷新重试。');
        autoStarted = false;
      });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', autoLoad, { once: true });
  else autoLoad();
})();
</script>
