<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>8BitGo 存档桥</title>
    <style>
      body { width: 280px; margin: 0; padding: 16px; color: #172033; font: 14px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 17px; }
      p { margin: 8px 0 14px; color: #536078; }
      button, a { display: block; width: 100%; box-sizing: border-box; border: 0; border-radius: 9px; padding: 10px 12px; font: inherit; font-weight: 650; text-align: center; }
      button { color: white; background: #2864dc; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      a { margin-top: 8px; color: #2458be; background: #edf3ff; text-decoration: none; }
      #status { min-height: 20px; margin-top: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>8BitGo PokeCatch 存档桥</h1>
    <p>只读取当前 8BitGo 游戏页内 Pokecatch 的 gachamon-save-v1，然后交给已登录的 8BitGo 云存档。</p>
    <button id="sync" type="button">读取并同步当前进度</button>
    <a id="open" href="https://8bitgo.com/pokecatch-save-sync" target="_blank" rel="noreferrer">打开云存档页面</a>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
