# 放进 8bitgo.com 的 HTTPS server {} 内，或像生产机一样由该 server include 本文件。
# CS1.6 的房间与公网 UDP 中继虽然挂在 /api 下，但它们是长连接；不能落入普通 HTTP 反代，
# 否则 nginx 会丢掉 Upgrade 头，后端只能收到一次普通 GET 并返回 404。
location ~ ^/api/cs16/(?:room|relay)$ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# GBA 与 jsnes 的 P2P 房间通过原生 WebSocket 交换 WebRTC 信令；普通站点反代会丢掉 Upgrade，
# 浏览器收到 404 后就无法创建或加入房间，故必须明确转发到同源 Node 服务。
location = /jsnes-netplay {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# DS WFC 的 SOCKFS 也走 /api，但每个 TCP/UDP socket 实际是 WebSocket；普通 /api 反代不会透传 Upgrade。
# 这里沿用已在生产 server {} include 的配置文件，部署时不必再手工加第二个 include。
location ^~ /api/nds-wfc/socket/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_buffering off;
}
