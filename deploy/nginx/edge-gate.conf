# 源站来源闸门 + 真实访客 IP + 大陆入口标记。生产路径：/etc/nginx/conf.d/edge-gate.conf
#
# 为什么不再用 ufw 锁 Cloudflare IP 段（AGENTS.md §2.30 旧做法）：大陆入口 cn.8bitgo.com 走腾讯 EdgeOne，
# 而 EdgeOne 已不公布回源 IP 段（api.edgeone.ai/ips 停服后只回 0.0.0.0/0）。ufw 因此对 80/443 全开，
# 改由这里区分来源，伪造 CF-Connecting-IP / EO-Connecting-IP 的直连请求一律 403。
#
# 部署：把 <EDGEONE_ORIGIN_SECRET> 换成 EdgeOne 规则引擎「修改 HTTP 回源请求头 X-8bitgo-Edge」里的值
# （生产机 /root/edgeone-origin-secret.txt，绝不进 git），再在站点 server{} 里：
#   include /etc/nginx/snippets/edge-gate.conf;            # 内容：if ($edge_allowed = 0) { return 403; }
#   proxy_set_header X-Forwarded-For $client_ip;           # 每个反代 location
#   proxy_set_header X-8bitgo-Site   $edge_site;           # location / （SSR 据此给 cn 换封面域）
# Cloudflare IP 段变了要同步 geo 块：https://www.cloudflare.com/ips/
#
map_hash_bucket_size 128;
geo $edge_src {
    default direct;
    127.0.0.1/32 local;
    ::1/128 local;
    173.245.48.0/20 cf;
    103.21.244.0/22 cf;
    103.22.200.0/22 cf;
    103.31.4.0/22 cf;
    141.101.64.0/18 cf;
    108.162.192.0/18 cf;
    190.93.240.0/20 cf;
    188.114.96.0/20 cf;
    197.234.240.0/22 cf;
    198.41.128.0/17 cf;
    162.158.0.0/15 cf;
    104.16.0.0/13 cf;
    104.24.0.0/14 cf;
    172.64.0.0/13 cf;
    131.0.72.0/22 cf;
    2400:cb00::/32 cf;
    2606:4700::/32 cf;
    2803:f800::/32 cf;
    2405:b500::/32 cf;
    2405:8100::/32 cf;
    2a06:98c0::/29 cf;
    2c0f:f248::/32 cf;
}
map $http_x_8bitgo_edge $edge_eo_key {
    default 0;
    "<EDGEONE_ORIGIN_SECRET>" 1;
}
map "$edge_src:$edge_eo_key" $edge_allowed {
    default 1;
    "direct:0" 0;
}
map "$edge_src:$edge_eo_key" $client_ip {
    default $remote_addr;
    "~^cf:" $http_cf_connecting_ip;
    "direct:1" $http_eo_connecting_ip;
}
# 只有带着正确回源密钥的 EdgeOne 请求才标成 cn；值为空时 proxy_set_header 不发这个头，
# 客户端自己带的同名头也会被覆盖掉，伪造不进来（见 shared/cn-host.js）。
map $edge_eo_key $edge_site {
    default "";
    1 cn;
}
