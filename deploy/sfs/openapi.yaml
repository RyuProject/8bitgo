openapi: 3.1.0
info:
  title: 8BitGo SFS 接入 API
  version: 1.1.0
  description: |
    SAS3 的 SmartFoxServer 1.x 发现、状态与 WebSocket 原始字节桥。
    WebSocket 不是 JSON 房间 API；调用方必须会生成和解析 SFS 1.x 数据。
externalDocs:
  description: 完整的开发者接入指南
  url: https://github.com/RyuProject/8bitgo/blob/main/docs/smartfoxserver-api.md
servers:
  - url: https://8bitgo.com
security: []
paths:
  /api/sfs/config:
    get:
      summary: 取得浏览器及原生客户端连接配置
      operationId: getSfsConfig
      description: 匿名、不缓存。浏览器跨域调用仍需命中 8BitGo 的 CORS 白名单。
      responses:
        '200':
          description: SFS 未启用时仍返回 200，enabled=false 且 ruffle 为空。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SfsConfig'
  /api/sfs/status:
    get:
      summary: 检查 Java sidecar 与桥接容量
      operationId: getSfsStatus
      description: 匿名、不缓存。计数器是当前 Node 进程生命周期内的值。
      responses:
        '200':
          description: 状态快照。ready=false 不代表主站故障。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SfsStatus'
  /sfs/sas3:
    get:
      summary: SAS3 WebSocket 到裸 TCP 的字节桥
      description: |
        使用 WebSocket Upgrade；成功后每个二进制帧按原字节写入 SmartFox TCP。
        TCP 回程的 WebSocket 帧边界不等于 SFS 业务消息边界，客户端必须按字节流解析。
      x-websocket: true
      responses:
        '101': { description: Switching Protocols }
        '403': { description: 浏览器 Origin 不在白名单 }
        '429': { description: 总连接或每 IP 连接达到上限 }
        '503': { description: SFS_ENABLED=0 }
components:
  schemas:
    SocketProxy:
      type: object
      required: [host, port, proxyUrl]
      properties:
        host: { type: string, const: sas3server.ninjakiwi.com }
        port: { type: integer, const: 444 }
        proxyUrl: { type: string, format: uri }
    SfsConfig:
      type: object
      required: [enabled, protocol, games, websocket, native, ruffle]
      properties:
        enabled: { type: boolean }
        protocol: { type: string, const: SmartFoxServer 1.x }
        games:
          type: array
          uniqueItems: true
          items:
            type: string
            examples: [sas3, sas-zombie-assault-3]
        websocket:
          oneOf:
            - type: 'null'
            - type: object
              required: [path, url]
              properties:
                path: { type: string }
                url: { type: string, format: uri }
        native:
          description: 只有配置 SFS_PUBLIC_TCP_HOST 时才返回；原 SWF 不会自动读取它。
          oneOf:
            - type: 'null'
            - type: object
              required: [host, port]
              properties:
                host: { type: string }
                port: { type: integer }
                note: { type: string }
        ruffle:
          type: object
          properties:
            socketProxy:
              type: array
              items: { $ref: '#/components/schemas/SocketProxy' }
            urlRewriteRules:
              type: array
              items:
                type: array
                prefixItems: [{ type: string }, { type: string }]
                minItems: 2
                maxItems: 2
    SfsStatus:
      type: object
      required: [enabled, ready, protocol, games, upstream, connections, traffic, lastUpstreamConnectedAt]
      properties:
        enabled: { type: boolean }
        ready: { type: boolean }
        protocol: { type: string, const: SmartFoxServer 1.x }
        games:
          type: array
          uniqueItems: true
          items:
            type: string
            examples: [sas3, sas-zombie-assault-3]
        upstream:
          type: object
          required: [reachable, checkedAt]
          properties:
            reachable: { type: boolean }
            checkedAt: { type: string, format: date-time }
        connections:
          type: object
          required: [active, accepted, rejected, limit, perIpLimit]
          properties:
            active: { type: integer, minimum: 0 }
            accepted: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1 }
            perIpLimit: { type: integer, minimum: 1 }
        traffic:
          type: object
          required: [fromClient, fromUpstream]
          properties:
            fromClient: { type: integer, minimum: 0 }
            fromUpstream: { type: integer, minimum: 0 }
        lastUpstreamConnectedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
