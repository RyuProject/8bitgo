# 可选：只有未修改的 Adobe Flash / Linux 客户端才需要公网原生 TCP。
# 这段属于 nginx 顶层 stream {}，不能放进 http/server/location；nginx 还需 stream 模块。
# Cloudflare 普通橙云不代理任意 TCP，域名必须 DNS-only，或另购 Spectrum。
upstream sas3_sidecar {
    server 127.0.0.1:8044;
}

server {
    listen 444;
    proxy_connect_timeout 3s;
    proxy_timeout 4h;
    proxy_pass sas3_sidecar;
}

