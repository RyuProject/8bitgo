# 8BitGo 远程联机：cloud-game 服务端
#
#   coordinator  信令 / 分配 worker（浏览器连它的 /ws）
#   worker-1..N  真正跑游戏 + 编码推流；一个 worker 同一时间只跑一个房间，
#                想要 N 个并发房间就复制 N 个 worker 段（改端口即可）
#   xvfb         N64 这类 OpenGL 核心需要一个 X 显示
#   coturn       TURN 中继：用户 NAT 穿不透时兜底（强烈建议保留）
#
# 使用：
#   git clone --depth 1 https://github.com/giongto35/cloud-game.git    # 与本文件同目录
#   cp .env.example .env && 编辑 PUBLIC_IP / TURN_SECRET
#   ./render-config.sh                                                  # 由 config.template.yaml 生成 config.yaml
#   ./sync-roms.sh                                                      # 把 R2 的 ROM 同步到 ./games
#   docker compose up -d --build
#
# 详细说明见 README.md

x-worker: &worker
  build:
    context: ./cloud-game
    target: cloud-game
  image: 8bitgo-cloud-game
  restart: unless-stopped
  depends_on:
    - coordinator
    - xvfb
  volumes:
    - ./config.yaml:/usr/local/share/cloud-game/configs/config.yaml:ro
    - ./games:/usr/local/share/cloud-game/assets/games
    - cores:/usr/local/share/cloud-game/assets/cores
    - saves:/root/.cr
    - x11:/tmp/.X11-unix
  environment: &worker-env
    DISPLAY: ":99"
    MESA_GL_VERSION_OVERRIDE: "4.5"
    CLOUD_GAME_WORKER_NETWORK_COORDINATORADDRESS: coordinator:8000
    # 公网 IP：worker 在 docker NAT 后面，必须告诉 WebRTC 用哪个地址发 ICE candidate
    CLOUD_GAME_WEBRTC_ICEIPMAP: ${PUBLIC_IP}
    CLOUD_GAME_ENCODER_VIDEO_CODEC: ${VIDEO_CODEC:-vp8}
    TURN_SECRET: ${TURN_SECRET}
    PUBLIC_IP: ${PUBLIC_IP}
  command: >
    bash -c "while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; ./worker"

services:
  coordinator:
    build:
      context: ./cloud-game
      target: cloud-game
    image: 8bitgo-cloud-game
    restart: unless-stopped
    volumes:
      - ./config.yaml:/usr/local/share/cloud-game/configs/config.yaml:ro
    environment:
      TURN_SECRET: ${TURN_SECRET}
      PUBLIC_IP: ${PUBLIC_IP}
    ports:
      # 浏览器 → ws://PUBLIC_IP:8000/ws ；生产环境请用 Caddy / nginx 反代成 wss（见 Caddyfile）
      - "8000:8000"
    command: ./coordinator

  worker-1:
    <<: *worker
    environment:
      <<: *worker-env
      CLOUD_GAME_WEBRTC_SINGLEPORT: "8443"
    ports:
      - "8443:8443/udp"

  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      CLOUD_GAME_WEBRTC_SINGLEPORT: "8444"
    ports:
      - "8444:8444/udp"

  # 再要并发房间就照着上面复制 worker-3 / 8445 …（每个大约占 1 个 CPU 核）

  xvfb:
    image: kcollins/xvfb:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command: ["rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 && exec Xvfb :99 -screen 0 640x480x24"]
    volumes:
      - x11:/tmp/.X11-unix

  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --external-ip=${PUBLIC_IP}
      --realm=8bitgo
      --lt-cred-mech --user=8bitgo:${TURN_SECRET}
      --min-port=49160 --max-port=49200
      --no-tls --no-dtls --no-cli --fingerprint

volumes:
  cores:
  saves:
  x11:
