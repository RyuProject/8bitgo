<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <!--
      ⚠️ 必须写 <base>：生产路由会把 /web/diablo/ 规范化成不带尾斜杠的 /web/diablo
      （见 server/src/index.js 的 normalizeUrl），浏览器此时会把 "diablo" 当成**文件**，
      相对路径会按 /web/ 解析 → 全部 404。CRA 注入的是 %PUBLIC_URL% 绝对路径，
      本身不受影响，这条是给页面里其它相对引用兜底，和 /web/PvZ、/web/cs15 保持一致。
    -->
    <base href="/web/diablo/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="《暗黑破坏神》(1996) 的浏览器移植版，基于 devilution 源码编译的 WebAssembly 运行。请自备 DIABDAT.MPQ，文件只在你的浏览器里处理。" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>暗黑破坏神 · 网页版 — 8bitgo</title>
  </head>
  <body>
    <noscript>需要开启 JavaScript 才能运行。</noscript>
    <div id="root"></div>
  </body>
</html>
