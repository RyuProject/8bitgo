<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <!--
      站标是一个 10×12 的像素「8」（public/favicon.svg 里一格一个 <rect>）。
      两份是同一张图，分工不同：
        · .ico 里压了 16/32/48 三层，每层都是整数倍最近邻放大，
          小尺寸下每个格子正好压在整数个物理像素上 —— 这是像素画唯一不糊的画法。
        · .svg 的 viewBox 也是 16×16（字形 10×12 居中，留 3/2 的边），
          所以缩到 16/32/48/64 时同样是整数倍，和 ico 看起来是同一张。
          ⚠️ 别把 viewBox 改成 12×12 去「贴边」：16/12 不是整数，
          每个格子会被摊成 1px 或 2px，宽窄不匀，像素风当场就散了。
      顺序按惯例 ico 在前、svg 在后：支持 svg 的浏览器会优先用后者。
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      按浏览器语言自动跳到对应语言版本。

      为什么必须内联、必须放在这里：这段要在**首屏绘制之前**跑完。写成模块脚本
      （像 entry-client 那样）是 defer 的，服务端渲染好的中文首屏会先画出来，
      用户看到中文闪一下再跳走。放在 head 里同步执行，浏览器还没画任何东西就跳了，
      顺带把后面的字体和 CSS 请求一起取消掉。

      规则：
        1. URL 已经带语言前缀（/ja/games）-> 保留，不擅自改语言。
        2. /admin -> 不动。后台不做多语言。
        3. 爬虫 -> 不动。八种语言各有自己的可收录 URL，把蜘蛛也跳走会让默认语言那份
           收不进去；hreflang 已经在 seo.ts 里输出，让搜索引擎自己按 hreflang 分发。
        4. 测速工具（Lighthouse / PageSpeed Insights / WebPageTest / GTmetrix）-> 不动。
           这条和第 3 条**理由不同**，所以单独一行判断、不要合进爬虫那串：
           爬虫是为了收录，测速工具是为了「量到的必须是你点的那个 URL」。
           PSI 请求 https://8bitgo.com/ 却被这段脚本送去 /en，报告顶上就会挂一条
           「客户端重定向，建议改用 https://8bitgo.com/en 重新测」，
           于是 `/`（简体中文首页，canonical 就是它自己）永远量不到。
        5. 用户自己选过语言（localStorage 的 8bitgo.lang）-> 优先，比浏览器语言更权威。
        6. 都没有 -> 按 navigator.languages 匹配；一个都对不上就用英语。

      ⚠️ 匹配规则的唯一出处是 src/config/languages.ts 的 matchBrowserLang()。
         这里因为要内联，不可避免抄了一份 —— scripts/test-lang-detect.mjs 会把两边
         逐个语言标记对一遍，改了一处忘了另一处会红。
    -->
    <!--
      不在明文 HTTP 上跑。

      2026-11-15 有人在 Android 模拟器的 Chrome 110 里打开《拳皇97》只看到「页面暂时没有正常打开」，
      浏览器同时提示「与 8bitgo.com 的连接不安全，该网站不支持 HTTPS」：那台设备上 HTTPS 连不上
      （模拟器系统时间不对最常见，证书会被判成「尚未生效」），Chrome 退回 http://，而大陆入口
      cn.8bitgo.com（EdgeOne）对 HTTP 照样回 200 整页。明文页面里 crypto.subtle 等安全上下文 API 不存在，
      写死 https:// 的资源、接口在这台设备上又都连不上，应用就崩到兜底页 —— 玩家只看到一句「没正常打开」。

      所以：明文 HTTP 先换成 HTTPS 再说；刚换过一次又被退回 HTTP（HTTPS 真连不上）就不再来回跳，
      直接在页面顶部说清楚原因和办法（多半是改对日期时间）。本机开发地址不受影响。必须放在所有脚本之前，
      而且只用 ES5：旧浏览器也要能看懂这句话。
    -->
    <script>
      ;(function () {
        try {
          var l = window.location
          if (l.protocol !== 'http:' || /^(localhost|127\.|\[::1\]$|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)|\.(localhost|test|local)$/.test(l.hostname)) return
          var key = '8bitgo.https-upgrade'
          var cookieKey = '8bitgo_https_try'
          var now = Date.now()
          // 防来回跳的记号：优先 sessionStorage；它不可用时（安卓 WebView 默认不开 DOM 存储）退到一分钟的 Cookie。
          // 两样都写不进才只提示、不跳 —— 以前 sessionStorage 一抛错就从不升级，HTTPS 明明能用也留在明文上。
          var readMark = function () {
            try { return Number(sessionStorage.getItem(key)) || 0 } catch (e) {}
            var m = /(?:^|;\s*)8bitgo_https_try=(\d+)/.exec(String(document.cookie || ''))
            return m ? Number(m[1]) : 0
          }
          var writeMark = function () {
            try { sessionStorage.setItem(key, String(now)); return true } catch (e) {}
            try {
              document.cookie = cookieKey + '=' + now + '; max-age=60; path=/; SameSite=Lax'
              return String(document.cookie || '').indexOf(cookieKey + '=' + now) >= 0
            } catch (e) { return false }
          }
          var last = readMark()
          if (!(now - last >= 0 && now - last < 60000) && writeMark()) {
            l.replace('https://' + l.host + l.pathname + l.search + l.hash)
            return
          }
          var zh = /^zh/i.test(document.documentElement.lang || navigator.language || '')
          var text = zh
            ? '当前是不安全的 HTTP 连接，游戏没法正常加载：你的浏览器连不上本站的 HTTPS。最常见的原因是设备的日期和时间不对（模拟器尤其常见），请在系统设置里把日期时间改成自动，再重新打开 https://8bitgo.com ；如果用了代理或网络过滤，也请关掉再试。'
            : 'This page is on an insecure HTTP connection, so games cannot load: your browser could not reach this site over HTTPS. The usual cause is a wrong device date and time (common on emulators). Set the date and time to automatic, then reopen https://8bitgo.com. If you use a proxy or network filter, try turning it off.'
          var show = function () {
            if (!document.body || document.getElementById('insecure-http-notice')) return
            var bar = document.createElement('div')
            bar.id = 'insecure-http-notice'
            bar.setAttribute('role', 'alert')
            bar.style.cssText = 'position:sticky;top:0;z-index:2147483647;padding:12px 16px;background:#7f1d1d;color:#fff;font:14px/1.5 system-ui,sans-serif;text-align:center'
            bar.textContent = text
            document.body.insertBefore(bar, document.body.firstChild)
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show)
          else show()
        } catch (e) {}
      })()
    </script>
    <!--
      坏 chunk 自修复的钩子（2026-11-15 PK / TH：浏览器拿到的 live-*.js 和源站不一样，缺具名导出直接崩）。

      正常访问只做两件小事，不发任何请求：
        1. 上次修复发现「CDN 边缘那份就是坏的」的文件，用 import map 改指到带查询串的回源地址
           （记在 localStorage 8bitgo.asset-remap，7 天过期）。必须在任何模块脚本之前插入，所以放在 head 这里。
        2. 定义 window.__8bitgoAssetRepair：真出错时才从入口脚本所在资源域加载修复脚本；大陆入口优先走 EdgeOne。
           入口模块本身链接失败时 React 根本起不来，所以这里还要监听 window 的 SyntaxError；
           React 里懒加载失败由 AppErrorBoundary 调同一个函数。
           每次加载修复脚本的经过（地址、失败 / 超时 / 成功、耗时）记在 window.__8bitgoAssetRepairLoad，
           诊断包靠它分清「加载失败」和「超时」（2026-11-16 诊断包 #761 只有一句「加载失败或超时」）。
      只用 ES5，任何一步出错都静默放过：这段坏了也不能拖垮页面。
    -->
    <script>
      ;(function () {
        try {
          var w = window
          var KEY = '8bitgo.asset-remap'
          try {
            var raw = localStorage.getItem(KEY)
            var supports = w.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')
            if (raw && supports) {
              var data = JSON.parse(raw)
              var imports = {}
              var count = 0
              var now = Date.now()
              for (var k in data) {
                if (Object.prototype.hasOwnProperty.call(data, k) && data[k] && data[k].until > now && typeof data[k].to === 'string') {
                  imports[k] = data[k].to
                  count++
                }
              }
              if (count) {
                var map = document.createElement('script')
                map.type = 'importmap'
                map.textContent = JSON.stringify({ imports: imports })
                document.head.appendChild(map)
              }
            }
          } catch (e) {}
          var pending = null
          var loadLog = w.__8bitgoAssetRepairLoad = []
          var repairScriptUrls = function () {
            var primary = ''
            var fallback = ''
            try {
              var entry = document.querySelector('script[type="module"][src*="/assets/index-"]')
              if (entry && entry.src) primary = new URL('asset-repair-v7.js', entry.src).href
            } catch (e) {}
            try {
              fallback = new URL('/assets/asset-repair-v7.js', w.location.href).href
            } catch (e) {
              fallback = '/assets/asset-repair-v7.js'
            }
            var urls = []
            if (primary) urls.push(primary)
            if (fallback && urls.indexOf(fallback) < 0) urls.push(fallback)
            /*
              主站地址也可能被浏览器 / CDN 缓存成失败响应（诊断包 #872：Safari 1ms 即 onerror）。
              先试入口对应的地址与主站，再给主站和入口各一次带随机查询串的机会；缓存键包含查询串时可绕开坏副本。
            */
            var nonce = Date.now().toString(36) + Math.random().toString(36).slice(2, 8)
            var cacheBust = function (url) {
              return url + (url.indexOf('?') < 0 ? '?' : '&') + 'asset-repair-script=' + nonce
            }
            if (fallback && fallback !== primary) urls.push(cacheBust(fallback))
            if (primary) urls.push(cacheBust(primary))
            return urls
          }
          w.__8bitgoAssetRepair = function (opts) {
            if (!pending) {
              pending = new Promise(function (resolve) {
                var urls = repairScriptUrls()
                var index = 0
                var loadNext = function () {
                  if (w.__8bitgoAssetRepairRun) {
                    try { Promise.resolve(w.__8bitgoAssetRepairRun(opts)).then(resolve, function () { resolve(null) }) } catch (e) { resolve(null) }
                    return
                  }
                  if (index >= urls.length) { resolve(null); return }
                  var s = document.createElement('script')
                  var settled = false
                  var url = urls[index++]
                  var t0 = Date.now()
                  var log = function (outcome) {
                    if (loadLog.length < 6) loadLog.push({ u: url, r: outcome, ms: Date.now() - t0 })
                  }
                  var timer = setTimeout(function () {
                    if (settled) return
                    settled = true
                    s.onload = s.onerror = null
                    log('timeout')
                    loadNext()
                  }, 5000)
                  var failed = function () {
                    if (settled) return
                    settled = true
                    clearTimeout(timer)
                    log('error')
                    loadNext()
                  }
                  s.src = url
                  s.async = true
                  s.onload = function () {
                    if (settled) return
                    settled = true
                    clearTimeout(timer)
                    log(w.__8bitgoAssetRepairRun ? 'ok' : 'empty')
                    if (w.__8bitgoAssetRepairRun) {
                      try { Promise.resolve(w.__8bitgoAssetRepairRun(opts)).then(resolve, function () { resolve(null) }) } catch (e) { resolve(null) }
                    } else loadNext()
                  }
                  s.onerror = failed
                  document.head.appendChild(s)
                }
                loadNext()
              })
            }
            return pending
          }
          var LINK = /does not provide an export named|import not found|Importing binding name/
          var resolveSpecifier = function (message, from) {
            var m = /module ['"](\.{1,2}\/[^'"]+\.js)['"]/.exec(message)
            if (!m || !from) return []
            try { return [new URL(m[1], from).href] } catch (e) { return [] }
          }
          w.addEventListener('error', function (event) {
            var err = event && event.error
            var file = String((event && event.filename) || '')
            if (!err || err.name !== 'SyntaxError' || file.indexOf('/assets/') < 0) return
            var message = String(err.message || '')
            w.__8bitgoAssetRepair({ reason: message.slice(0, 300), urls: [file].concat(resolveSpecifier(message, file)) })
          })
          w.addEventListener('unhandledrejection', function (event) {
            var err = event && event.reason
            if (!err || err.name !== 'SyntaxError' || !LINK.test(String(err.message || ''))) return
            var entry = document.querySelector('script[type="module"][src*="/assets/index-"]')
            var message = String(err.message || '')
            w.__8bitgoAssetRepair({ reason: message.slice(0, 300), urls: resolveSpecifier(message, entry ? entry.src : '') })
          })
        } catch (e) {}
      })()
    </script>
    <!--
      先选离访客更快的完整站点镜像，再让语言脚本决定目标路径。它只写一个两小时的
      非认证 Cookie；已有登录态、后台、OAuth、爬虫和测速工具会留在当前域名。
      构建时把 public/edge-route-v5.js 原样内联，避免首屏多一次同步网络往返；
      文件名仍保留给已缓存旧 HTML 的访客，发版改变规则时必须同时换版本。
    -->
    <script data-8bitgo-edge-route-placeholder></script>
    <script>
      (function () {
        try {
          var CODES = ['zh-Hans', 'zh-Hant', 'en', 'es', 'fr', 'it', 'de', 'ja']
          var SIMPLE = ['en', 'es', 'fr', 'it', 'de', 'ja']
          var DEFAULT_LANG = 'zh-Hans'
          var FALLBACK_LANG = 'en'

          var path = location.pathname
          var seg = path.split('/')[1] || ''
          if (seg === 'admin') return
          var ua = navigator.userAgent || ''
          // google-|googleother：Search Console「网址检查」的实时测试是 Google-InspectionTool，
          // 还有 GoogleOther / Google-Read-Aloud，UA 里都没有 bot 字样；漏掉的话裸路径（简体）
          // 会被跳到 /en/…，站长在 Search Console 里看到的是错的页面和 canonical
          if (/bot|crawl|spider|slurp|google-|googleother|mediapartners|facebookexternalhit|embedly|preview/i.test(ua)) return

          // 测速代理。上面那串一个都不匹配 —— PSI 的 UA 长这样：
          //   Mozilla/5.0 (Linux; Android 11; moto g power (2022)) ... Mobile Safari/537.36 Chrome-Lighthouse
          // 认的是后缀里的 lighthouse / pagespeed / ptst(WebPageTest) / gtmetrix，
          // 这几个词在真实浏览器 UA 里不会出现，所以不怕误伤。
          //
          // ⚠️ 只认得出「自报家门」的那一类。Lighthouse 本地 CLI 默认的模拟 UA 是
          //    干净的 moto g power 串（core/config/constants.js 里的常量，没有后缀），
          //    和真实的 Moto G 用户一模一样 —— 那种情况**故意不猜**：宁可测速工具吃一次
          //    跳转，也不能把真人当机器扣掉他的语言。
          if (/lighthouse|pagespeed|page speed|ptst|gtmetrix/i.test(ua)) return

          var target = path + location.search + location.hash
          if (CODES.indexOf(seg) < 0) {
            var pick = null

            // 用户显式选过的语言最优先
            try {
              var saved = localStorage.getItem('8bitgo.lang')
              if (CODES.indexOf(saved) >= 0) pick = saved
            } catch (e) {
              /* 隐私模式下读不了，当作没选过 */
            }

            if (!pick) {
              var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
              for (var i = 0; i < tags.length && !pick; i++) {
                var tag = String(tags[i] || '').toLowerCase()
                if (!tag) continue
                if (tag.indexOf('zh') === 0) {
                  // hans 先判：zh-Hans-HK 这种既有 hans 又有 hk，简繁标注比地区码更权威
                  pick = tag.indexOf('hans') >= 0 ? 'zh-Hans' : tag.indexOf('hant') >= 0 || /-(tw|hk|mo)\b/.test(tag) ? 'zh-Hant' : 'zh-Hans'
                } else {
                  var base = tag.split('-')[0]
                  if (SIMPLE.indexOf(base) >= 0) pick = base
                }
              }
              if (!pick) pick = FALLBACK_LANG
            }

            // 默认语言就是裸路径本身，不用跳
            if (pick !== DEFAULT_LANG) target = '/' + pick + (path === '/' ? '' : path) + location.search + location.hash
          }

          // CDN 选择脚本异步测速；它会在同域和跨域两种情况都保留 target。
          // 外部脚本加载失败时保留旧行为，语言切换不能依赖这项性能优化。
          if (typeof __8bitgoEdgeRoute === 'function') {
            __8bitgoEdgeRoute(target)
            return
          }

          // replace 而不是 assign：不往历史里塞一条，用户按返回键不会被弹回来又跳走
          if (target !== path + location.search + location.hash) location.replace(target)
        } catch (e) {
          /* 这段出任何问题都当没发生过 —— 语言选错了是小事，白屏是大事 */
        }
      })()
    </script>
    <meta name="theme-color" content="#ffffff" />

    <!--
      站点归属验证。这些标签**不能**加 data-ssr-default —— 那个标记是给
      SSR 用来「按页替换」的，加了会被 server/src/ssr.js 当成默认值删掉，
      蜘蛛来抓首页时就找不到验证串了。
      ⚠️ 验证通过后**不能删**：百度官方明确说「为使您的网站一直保持验证通过的状态，
      请保留验证的文件、html 标签，我们会去定期检查验证记录」——删了会掉验证状态。
      AdSense 同理，它会定期回抓核对发布商身份，删掉会掉「网站所有权已验证」状态。

      google-adsense-account 是 AdSense 的所有权验证 meta（后台「验证网站所有权 →
      元标记」那一项）。它只管验证，不影响广告投放 —— 投放靠的是页面里
      src/components/ads/AdSenseSlot.tsx 注入的广告代码，两者别混。
    -->
    <meta name="baidu-site-verification" content="codeva-nNJUgrBqRg" />
    <meta name="sogou_site_verification" content="oVuyKNKxkI" />
    <meta name="shenma-site-verification" content="66ff5965d00e6114dc938fed9a698263_1788614960" />
    <meta name="bytedance-verification-code" content="TPx+b4flhKHs7KiJcOf2" />
    <meta name="google-adsense-account" content="ca-pub-9765778307056404" />

    <!--
      头条搜索自动收录。动态插入不会阻塞首屏；URL 必须保持纯文本，不能使用
      Markdown 的 [文字](链接) 写法，否则浏览器会把整段当成无效地址。
    -->
    <script>
      ;(function () {
        /*
          带查询串的地址一条都不推：/games?q= / ?platform= 这类没有独立收录价值，
          只允许爬虫在已经知道 URL 时重抓，不该再主动提交。push.js 读的是它执行那一刻的 location.href，
          所以这道闸只能在这儿设 —— 有人直接打开一个 ?q= 的分享链接时，
          首屏这一次就会把它送出去（SPA 内部跳转那一半在 services/autoInclude.ts）。
        */
        if (location.search) return
        // 爬虫无需再被浏览器脚本提交一次；后台、登录、内嵌页也不属于公开落地页。
        var ua = navigator.userAgent || ''
        if (/bot|crawl|spider|slurp|google-|googleother|mediapartners|facebookexternalhit|embedly|preview/i.test(ua)) return
        var path = location.pathname.replace(/^\/(?:zh-Hans|zh-Hant|en|es|fr|it|de|ja)(?=\/|$)/, '') || '/'
        if (/^\/(?:admin|embed|play|auth|login|me)(?:\/|$)/.test(path)) return
        // 隔离播放器和内嵌 PSP 详情页启用了 require-corp；第三方脚本一定会被拦，主动跳过。
        if (window.crossOriginIsolated) return

        function inject() {
          if (document.getElementById('ttzz')) return
          var el = document.createElement('script')
          el.src = 'https://lf1-cdn-tos.bytegoofy.com/goofy/ttzz/push.js?553648437e35e84f3b28cee0b9ed7edd7991cc1ed11bf34132b851984d3f927c3871f0d6a9220c04b06cd03d5ba8e733fe66d20303562cd119c1d6f449af6378'
          el.id = 'ttzz'
          var s = document.getElementsByTagName('script')[0]
          if (s && s.parentNode) s.parentNode.insertBefore(el, s)
        }

        // 收录提交不是首屏依赖；等文档与关键渲染完成后再借用空闲时间，避免第三方 JS
        // 和入口脚本、字体、首屏封面抢连接。旧浏览器在 load 后稍等片刻再执行。
        function scheduleIdle() {
          if (typeof window.requestIdleCallback === 'function') {
            window.requestIdleCallback(inject, { timeout: 5000 })
          } else {
            window.setTimeout(inject, 1000)
          }
        }
        function afterLoad() {
          window.setTimeout(scheduleIdle, 500)
        }
        if (document.readyState === 'complete') afterLoad()
        else window.addEventListener('load', afterLoad, { once: true })
      })()
    </script>

    <!--
      默认 SEO：服务端渲染时，server/src/ssr.js 会按 data-ssr-default 标记删掉下面这些，

      ⚠️ 每个带 data-ssr-default 的标签必须写在一行内 —— 删除用的是单行正则，
         拆成多行会漏删，结果是页面上出现两份 description（且中文那份排在前面）。
      纯静态托管（不走 SSR）时这些就是实际生效的默认值。

    <!--
      首页和游戏详情页不下载第三方字体：首页标题会轮换，晚到的字体替换会移动整页；游戏页则不能和 ROM / 核心争弱网连接。
      系统字体栈已在 src/index.css 兜底；其它页面等 load 后空闲再加载，省下首屏关键请求槽。
      Save-Data、2G、低下行或高 RTT 环境完全跳过字体请求，避免为装饰字体增加用户流量。
    -->
    <script>
      ;(function () {
        try {
          var sitePath = (window.location.pathname || '/').replace(/^\/(?:zh-Hans|zh-Hant|en|es|fr|it|de|ja)(?=\/|$)/, '') || '/'
          if (sitePath === '/' || /^\/(?:games\/[^/]+|play)(?:\/|$)/i.test(sitePath)) return
          var connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection
          if (connection) {
            var effectiveType = String(connection.effectiveType || '').toLowerCase()
            var downlink = Number(connection.downlink)
            var rtt = Number(connection.rtt)
            if (connection.saveData || /^(?:slow-2g|2g)$/.test(effectiveType) ||
                (downlink > 0 && downlink < 1.5) || (rtt > 0 && rtt >= 350)) return
          }

          function loadFonts() {
            if (document.getElementById('zeoseven-fonts')) return
            var link = document.createElement('link')
            link.id = 'zeoseven-fonts'
            link.rel = 'stylesheet'
            link.href = 'https://fontsapi.zeoseven.com/214/main/result.css'
            link.crossOrigin = 'anonymous'
            document.head.appendChild(link)
          }
          function scheduleIdle() {
            if (typeof window.requestIdleCallback === 'function') {
              window.requestIdleCallback(loadFonts, { timeout: 5000 })
            } else {
              window.setTimeout(loadFonts, 1500)
            }
          }
          function afterLoad() { window.setTimeout(scheduleIdle, 500) }
          if (document.readyState === 'complete') afterLoad()
          else window.addEventListener('load', afterLoad, { once: true })
        } catch (e) {}
      })()
    </script>
