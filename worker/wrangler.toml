# 8BitGo ROM 代理 Worker
# 部署：cd worker && npx wrangler login && npx wrangler deploy
# 设置列表接口口令：npx wrangler secret put ADMIN_TOKEN
name = "8bitgo-roms"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 玩家端固定使用这个公开地址；路由到 Worker 后才会执行 Range、CORS 与 Cache API。
# R2 binding 直接返回的响应不会仅凭 Cache-Control 自动进入边缘缓存。
routes = [
  { pattern = "assets.8bitgo.com/*", zone_name = "8bitgo.com" },
  # 封面独立域名也必须经过同一个 Worker，才能带 CORS / CORP 并读取 COVERS 桶。
  { pattern = "image.8bitgo.com/*", zone_name = "8bitgo.com" },
  # 开放平台凭据下载与旧 8BG 对象的域名；DNS 不走代理、CNAME 到第三方优选域名。
  # 和 assets 共用同一个 Worker，私有前缀保护、romv 校验、Range 边缘缓存都照常生效。
  { pattern = "download.8bitgo.com/*", zone_name = "8bitgo.com" },
  # 站内播放器读取明文 ROM / BIOS / 系统镜像的专用域名，与 download 共用 R2 对象和 Worker。
  # DNS-only CNAME 到优选域名；两者的 CNAME 目标由
  # deploy/cname-optimizer 定时体检、失效时自动换成别的优选域名。
  { pattern = "rom.8bitgo.com/*", zone_name = "8bitgo.com" },
  # 这两个自定义域名原先只存在于 Cloudflare 控制台。Wrangler 部署会用本文件覆盖远端
  # 路由，若不一并声明，后台上传/PSP 转换使用的 roms 域名会在一次正常发布后消失。
  { pattern = "roms.8bitgo.com", custom_domain = true },
  { pattern = "image.8bitgo.com", custom_domain = true },
  # Cloudflare for SaaS 预备（2026-11-17）：NS 迁出 Cloudflare 后，8bitgo.com 的这些主机名以
  # custom hostname 身份挂在 SaaS 区域 8bitgo.top 上，Worker 路由也必须建在那个区域。
  # 迁移前两套并存：主机名在 8bitgo.com 区域有效时只走上面那组。迁移后删掉上面**整组**，即
  # zone_name = "8bitgo.com" 的四条 **以及** 两条没写 zone_name 的 custom_domain 路由
  # （roms.8bitgo.com、image.8bitgo.com）——后者同样挂在 8bitgo.com 区域，NS 迁走后留着会让
  # `wrangler deploy` 失败（Worker 自定义域只能建在本区域，SaaS 上用下面的普通路由代替）。
  { pattern = "assets.8bitgo.com/*", zone_name = "8bitgo.top" },
  { pattern = "image.8bitgo.com/*", zone_name = "8bitgo.top" },
  { pattern = "download.8bitgo.com/*", zone_name = "8bitgo.top" },
  { pattern = "rom.8bitgo.com/*", zone_name = "8bitgo.top" },
  { pattern = "roms.8bitgo.com/*", zone_name = "8bitgo.top" },
  # html5 迁移前是 8bitgo-webgame 桶的 R2 自定义域，迁移后由 src/html5.js 只读接管。
  { pattern = "html5.8bitgo.com/*", zone_name = "8bitgo.top" },
]

[[r2_buckets]]
binding = "ROMS"
bucket_name = "8bitgo"

[[r2_buckets]]
binding = "COVERS"
# image.8bitgo.com 对应的 R2 桶名。
bucket_name = "8bitgo-image"

[[r2_buckets]]
binding = "WEBGAMES"
# CS1.5 / CS1.6 的大包单独存放；公开读取仍统一走 assets.8bitgo.com。
bucket_name = "8bitgo-webgame"

[vars]
# 允许跨域访问的来源，多个用逗号分隔；开发期用 * ，上线后改成你的站点域名，例如
# ALLOWED_ORIGINS = "https://8bitgo.example.com,http://localhost:5173"
ALLOWED_ORIGINS = "*"

# 下载域名上把 /api/open/v1/rom-plain|bundle-plain 与 /api/diag 原样转发给源站（见 src/index.js
# 的 PLAIN_PROXY_PATH）。凭据校验、限流、解密都在源站；留空任一项即关闭转发。
PLAIN_PROXY_HOSTS = "download.8bitgo.com"
PLAIN_PROXY_ORIGIN = "https://8bitgo.com"

# html5.8bitgo.com：只读整桶 WEBGAMES，CORS 与桶上的 R2 CORS 策略保持一致（src/html5.js）。
HTML5_HOSTS = "html5.8bitgo.com"
HTML5_ALLOWED_ORIGINS = "https://8bitgo.com,https://*.8bitgo.com"

# 以下上限单位为 MiB，只约束单次 PUT；不能绕过平台入口大小上限。
MAX_UPLOAD_MB = "512"
# 缓存分两档，判据是**请求 URL 有没有版本戳**（完整理由见 src/index.js 顶部注释）：
#   不带版本戳 —— 封面 / 视频 / logo：后台替换时复用同一个 key，长 TTL 会让玩家
#                 长期看到旧图 → 短缓存 + 重验证
#   带 ?romv=<etag> —— ROM：客户端按 ETag 拼的，内容换了 URL 就换（内容寻址）→ 长缓存
# 这两行只是把代码里的默认值显式写出来；删掉同样能跑，改策略不必改代码。
OBJECT_CACHE_CONTROL = "public, max-age=300, s-maxage=600, must-revalidate"
VERSIONED_CACHE_CONTROL = "public, max-age=86400, s-maxage=2592000, stale-while-revalidate=86400"
# 路径中带完整 SHA-256 的 CS16 Zstd 分片永不原地覆盖，可以浏览器和边缘都缓存一年。
IMMUTABLE_CACHE_CONTROL = "public, max-age=31536000, s-maxage=31536000, immutable"
